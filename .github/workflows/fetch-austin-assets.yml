# Downloads free-licensed Austin attraction photos and checks the Austin
# links (see scripts/fetch-austin-assets.mjs), then commits the results back to
# the branch. Runs only when the script or this workflow changes, or on demand.
name: Fetch Austin assets

on:
  push:
    paths:
      - scripts/fetch-austin-assets.mjs
      - .github/workflows/fetch-austin-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install sharp (script-only dependency)
        run: npm install --no-save --no-audit --no-fund sharp@0.33.5
      - name: Fetch photos and check links
        run: node scripts/fetch-austin-assets.mjs
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/attractions scripts/austin-assets-report.json
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Add Austin attraction photos and link report (automated fetch)"
          git push
